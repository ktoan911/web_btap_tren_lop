version: '3'
services:
  mongodb:
    image: mongo:latest
    container_name: student-mongo
    ports:
      - "27018:27017"
    volumes:
      - student_mongo_data:/data/db

  backend:
    build: ./backend
    container_name: student-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/student_db

  frontend:
    build: ./student-management
    container_name: student-frontend
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  student_mongo_data:
